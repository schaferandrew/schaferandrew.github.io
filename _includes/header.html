<header>
    <nav class="constrain nav-container" aria-label="Main">
        <div class="nav-bar">
            <a class="nav-logo" rel="author" href="{{ '/' | relative_url }}">
                <div class="nav-title h1">{{ site.title | escape }}</div>
            </a>
            <button class="nav-toggle" type="button" aria-controls="nav-menu" aria-expanded="false" aria-label="Toggle menu">
                <i></i><i></i><i></i>
            </button>
            <ul class="nav-menu" id="nav-menu">
                {%- assign nav_links = "culture,technology,travel" | split: "," -%}
                {%- for link in nav_links %}
                {%- assign link_url = '/' | append: link -%}
                <li><a class="nav-link" href="{{ link_url | relative_url }}" {% if page.url contains link_url %}aria-current="page"{% endif %}>{{ link }}</a></li>
                {%- endfor %}
            </ul>
        </div>
        <hr>
    </nav>
    <script>
        (function () {
            var toggle = document.querySelector('.nav-toggle');
            toggle.addEventListener('click', function () {
                var open = toggle.getAttribute('aria-expanded') === 'true';
                toggle.setAttribute('aria-expanded', String(!open));
            });
        })();
    </script>
</header>
