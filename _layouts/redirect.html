<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting…</title>
  <script>
    (function () {
      // Legacy link translator for /crucible/* URLs → /crucible-dashboard/ equivalents.
      // Maps old hash grammar (#id&key=value) to new query params and path structure.

      function dec(s) {
        try { return decodeURIComponent(s.replace(/\+/g, ' ')); } catch { return s; }
      }

      function parseHash(hash) {
        const s = hash.startsWith('#') ? hash.slice(1) : hash;
        let id = '';
        let haveId = false;
        const params = new Map();
        const raw = new Map();
        for (const part of s.split('&')) {
          if (!part) continue;
          const eq = part.indexOf('=');
          if (eq < 0) {
            if (!haveId) { id = dec(part); haveId = true; }
            continue;
          }
          const k = dec(part.slice(0, eq));
          if (!params.has(k)) { params.set(k, dec(part.slice(eq + 1))); raw.set(k, part.slice(eq + 1)); }
        }
        return { id, params, raw };
      }

      function list(raw) {
        if (!raw) return [];
        return raw.split(',').map(dec).filter(v => v && v !== 'all');
      }

      const isOn = (v) => v === '1' || v === 'true';

      // Route detection: determines which dashboard page to redirect to
      function routeOf(pathname) {
        let p = pathname.replace(/\/index\.html$/, '/');
        if (p === '/crucible') p += '/';
        if (!p.startsWith('/crucible/')) return null;
        const rest = p.slice('/crucible'.length + 1).replace(/\/+$/, '');
        if (rest === '') return 'main';
        switch (rest) {
          case 'task': case 'model': case 'compare': case 'run': case 'todo': case 'about':
            return rest;
          default: return null;
        }
      }

      // URL builders for the dashboard paths
      const enc = encodeURIComponent;
      function taskPath(id) { return '/crucible-dashboard/task/' + (id ? enc(id) : '') + '/'; }
      function modelPath(model) { const parts = model.split('/'); return '/crucible-dashboard/model/' + parts.map(enc).join('/') + '/'; }
      function comparePath() { return '/crucible-dashboard/compare/'; }
      function runsPath() { return '/crucible-dashboard/runs/'; }
      function todoPath() { return '/crucible-dashboard/todo/'; }
      function aboutPath() { return '/about/'; }

      // Legacy slug → setup ID mappings (optional, for future use)
      const legacyMaps = {};

      function translateUrl(inputUrl, maps) {
        try {
          const u = new URL(inputUrl, location.origin);
          const route = routeOf(u.pathname);
          if (!route) return null;

          const hashData = parseHash(u.hash || '');
          const qParams = parseHash((u.search.startsWith('?') ? u.search.slice(1) : u.search) || '').params;
          
          const suite = hashData.params.get('suite');

          switch (route) {
            case 'main': {
              const params = {};
              if (hashData.raw.has('compare')) {
                const slugs = list(hashData.raw.get('compare')).slice(0, 4);
                // Map legacy setup slugs to IDs
                params.s = slugs.map(s => maps.setups?.[s] || s).join(',');
                if (suite) params.suite = suite;
              } else {
                const modeId = hashData.id || null;
                if (modeId) params.mode = modeId;  // Include combined mode too
                if (suite) params.suite = suite;
                
                // Filter parameters from hash
                // Old single-select defaults: harness `best`, where `all` (filtered by list())
                for (const key of ['exclude', 'harness', 'where', 'hw', 'format', 'quant', 'packager', 'reasoning']) {
                  let values = list(hashData.raw.get(key));
                  // Also filter out harness default 'best'
                  if (key === 'harness') { values = values.filter(v => v !== 'best'); }
                  if (values.length) params[key] = values.join(',');
                }
                
                // Provisional toggle: hash wins over query string
                if (hashData.params.has('provisional')) {
                  if (isOn(hashData.params.get('provisional'))) params.provisional = '1';
                } else if (isOn(qParams.get('provisional'))) {
                  params.provisional = '1';
                }
              }
              return '/crucible-dashboard/' + (Object.keys(params).length ? '?' + new URLSearchParams(params).toString() : '?');
            }

            case 'task': {
              const taskId = hashData.id || null;
              if (!taskId) return taskPath(); // /task/ page
              
              const params = {};
              if (suite) params.suite = suite;
              if (isOn(hashData.params.get('provisional'))) params.provisional = '1';
              
              return taskPath(taskId) + (Object.keys(params).length ? '?' + new URLSearchParams(params).toString() : '');
            }

            case 'model': {
              let modelId = hashData.id || null;
              if (!modelId) return '/crucible-dashboard/model/';
              
              // Handle legacy maker mappings (e.g., ibm → ibm-granite)
              const defaultMakers = { 'ibm': 'ibm-granite' };
              let path;
              
              if (modelId.startsWith('/')) {
                // Already a full model ID format
                path = modelPath(modelId.slice(1));
              } else {
                const slash = modelId.indexOf('/');
                if (slash < 0) {
                  // Just maker name or unknown (-/foo style)
                  const rawMaker = modelId === '-' ? 'unknown' : modelId;
                  path = '/crucible-dashboard/model/' + enc(defaultMakers[rawMaker] || rawMaker) + '/';
                } else {
                  const rawMaker = modelId.slice(0, slash);
                  const name = modelId.slice(slash + 1);
                  const maker = (defaultMakers[rawMaker] || maps.makers?.[rawMaker]) || rawMaker;
                  path = modelPath(maker + '/' + name);
                }
              }
              
              const params = {};
              if (suite) params.suite = suite;
              if (hashData.params.get('mode')) params.mode = hashData.params.get('mode');
              
              // Setup slug translation
              const setupSlug = hashData.raw.get('setup');
              if (setupSlug) {
                const setupId = maps.setups?.[setupSlug] || setupSlug;
                params.setup = setupId;
              }
              
              return path + (Object.keys(params).length ? '?' + new URLSearchParams(params).toString() : '?');
            }

            case 'compare': {
              const slugs = list(hashData.id);
              const ids = slugs.map(s => maps.setups?.[s] || s);
              const params = {};
              if (ids.length) params.s = ids.join(',');
              if (suite) params.suite = suite;
              if (hashData.params.get('mode')) params.mode = hashData.params.get('mode');
              
              return comparePath() + '?' + new URLSearchParams(params).toString();
            }

            case 'todo': {
              const params = {};
              if (suite) params.suite = suite;
              if (hashData.params.get('mode')) params.mode = hashData.params.get('mode');
              
              const sort = hashData.raw.get('sort');
              if (sort && sort !== 'easiest') params.sort = sort;
              if (isOn(hashData.params.get('all'))) params.all = '1';
              
              return todoPath() + '?' + new URLSearchParams(params).toString();
            }

            case 'run': {
              // Old runs page redirects to /runs/
              return runsPath();
            }

            case 'about': {
              return aboutPath();
            }

            default: return null;
          }
        } catch (e) {
          console.error('Legacy URL translation failed:', e);
          return null;
        }
      }

      const target = translateUrl(location.href, legacyMaps);
      
      if (target) {
        location.replace(target);
      } else {
        // Fallback: just redirect to dashboard root with a note about the issue
        console.warn('Could not translate legacy URL:', location.pathname);
        location.replace('/crucible-dashboard/');
      }
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/crucible-dashboard/">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 2rem; text-align: center; color: #333; }
    a { color: #1856a3; }
  </style>
</head>
<body>
  <p>This page has moved to <a href="/crucible-dashboard/">the Crucible dashboard</a>.</p>
  <p><small>If you were looking for specific content, the page should redirect automatically.</small></p>
</body>
</html>
