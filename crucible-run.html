---
layout: default
title: Crucible runs
noindex: true
permalink: /crucible/run/
---
<div class="constrain crucible crucible-run">
  <p class="crucible-breadcrumb"><a href="/crucible/">Crucible</a> › Runs</p>
  <h1 class="crucible-title">Recent runs</h1>

  <p class="crucible-status" id="crucible-status" role="status">Loading runs…</p>

  <section class="crucible-results" aria-label="Runs" id="crucible-results" hidden>
    <div class="crucible-suite-bar">
      <label class="crucible-toolbar-label" for="suite-select" id="suite-select-label">Suite</label>
      <select class="crucible-select" id="suite-select"></select>
      <span class="crucible-suite-line" id="suite-line"></span>
    </div>
    <p class="crucible-sub crucible-suite-note" id="suite-note" hidden></p>

    <div class="crucible-toolbar crucible-toolbar-tight">
      <label class="crucible-toolbar-label" for="run-sort">Sort by</label>
      <select class="crucible-select" id="run-sort">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="model">Model name</option>
        <option value="score-desc">Score (high to low)</option>
        <option value="score-asc">Score (low to high)</option>
      </select>
      <label class="crucible-toolbar-label" for="run-filter">Filter</label>
      <select class="crucible-select" id="run-filter">
        <option value="all">All runs</option>
        <option value="finished">Finished only</option>
        <option value="timeout">Timeouts only</option>
        <option value="error">Errors only</option>
      </select>
    </div>

    <div class="crucible-run-grid" id="crucible-run-grid"></div>
    <p class="crucible-sub" id="run-count"></p>
  </section>
</div>

<script src="/assets/js/crucible-core.js?v={{ site.time | date: '%s' }}"></script>
<script src="/assets/js/crucible-run.js?v={{ site.time | date: '%s' }}" data-src="/crucible/data.json?v={{ site.time | date: '%s' }}" data-details="/crucible/details.json?v={{ site.time | date: '%s' }}" data-outputs="/crucible-data/"></script>
